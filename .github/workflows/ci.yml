name: CI
on:
  push: {branches: [master]}
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: "Static analysis (Code)"

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with: {persist-credentials: false}
    - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
    - run: dart --version
    - run: dart pub get
    - run: dart analyze --fatal-infos --fatal-warnings .

  analyze_ci:
    name: Static analysis (GitHub Actions)
    runs-on: ubuntu-latest

    permissions:
      security-events: write # Required by upload-sarif
      actions: read # Required by upload-sarif
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with: {persist-credentials: false}
    - uses: zizmorcore/zizmor-action@6599ee8b7a49aef6a770f63d261d214911a7ce02 # v0.6.0
      with: {persona: pedantic}

  test:
    name: "Tests | Dart ${{ matrix.dart-channel }} | ${{ matrix.os }}"

    strategy:
      matrix:
        # TODO: Run tests on Windows when dart-lang/pub#2982 is fixed.
        os: [ubuntu, macos]
        dart-channel: [stable, dev]
      fail-fast: false

    runs-on: ${{ matrix.os }}-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with: {persist-credentials: false}
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0

    - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
      with:
        sdk: ${{ matrix.dart-channel }}
    - run: dart --version

    - run: dart pub get
    - run: dart pub run test -r expanded

  format:
    name: "Code formatting"

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with: {persist-credentials: false}
    - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
    - run: dart --version
    - run: dart pub get
    - run: dart format .
    - run: dart fix --apply
    - run: git diff --exit-code
