name: CI
on:
  push: {branches: [master]}
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: "Static analysis (Code)"

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with: {persist-credentials: false}
    - uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
    - run: dart --version
    - run: dart pub get
    - run: dart analyze --fatal-infos --fatal-warnings .

  analyze_ci:
    name: Static analysis (GitHub Actions)
    runs-on: ubuntu-latest

    permissions:
      security-events: write # Required by upload-sarif
      actions: read # Required by upload-sarif
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with: {persist-credentials: false}
    - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
      with: {persona: pedantic}

  test:
    name: "Tests | Dart ${{ matrix.dart-channel }} | ${{ matrix.os }}"

    strategy:
      matrix:
        # TODO: Run tests on Windows when dart-lang/pub#2982 is fixed.
        os: [ubuntu, macos]
        dart-channel: [stable, dev]
      fail-fast: false

    runs-on: ${{ matrix.os }}-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with: {persist-credentials: false}
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0

    - uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
      with:
        sdk: ${{ matrix.dart-channel }}
    - run: dart --version

    - run: dart pub get
    - run: dart pub run test -r expanded

  format:
    name: "Code formatting"

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with: {persist-credentials: false}
    - uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
    - run: dart --version
    - run: dart pub get
    - run: dart format .
    - run: dart fix --apply
    - run: git diff --exit-code
